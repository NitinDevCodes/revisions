<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Information Entry Form</title>
</head>
<body>

    <h1>KCC Institute Information Entry Form</h1>
    <p>Please fill out the form below to submit student, employee, or faculty details.</p>
    <hr>

    <form action="#" method="post" enctype="multipart/form-data">

        <!-- Category Selection -->
        <fieldset>
            <legend>Registration Category</legend>
            <p>
                <label>Select Category:</label><br>
                <input type="radio" id="student" name="category" value="student" checked>
                <label for="student">Student</label>
                
                <input type="radio" id="faculty" name="category" value="faculty">
                <label for="faculty">Faculty</label>
                
                <input type="radio" id="staff" name="category" value="staff">
                <label for="staff">Non-Teaching Staff / Employee</label>
            </p>
        </fieldset>
        <br>

        <!-- Personal Information -->
        <fieldset>
            <legend>Personal Details</legend>
            
            <p>
                <label for="full_name">Full Name:</label><br>
                <input type="text" id="full_name" name="full_name" required placeholder="Enter full name">
            </p>

            <p>
                <label for="dob">Date of Birth:</label><br>
                <input type="date" id="dob" name="dob" required>
            </p>

            <p>
                <label for="gender">Gender:</label><br>
                <select id="gender" name="gender" required>
                    <option value="">-- Select Gender --</option>
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                    <option value="other">Other</option>
                </select>
            </p>

            <p>
                <label for="photo">Upload Photo:</label><br>
                <input type="file" id="photo" name="photo" accept="image/*">
            </p>
        </fieldset>
        <br>

        <!-- Contact Information -->
        <fieldset>
            <legend>Contact Details</legend>

            <p>
                <label for="email">Email Address:</label><br>
                <input type="email" id="email" name="email" required placeholder="example@institute.edu">
            </p>

            <p>
                <label for="phone">Phone Number:</label><br>
                <input type="tel" id="phone" name="phone" required placeholder="10-digit phone number">
            </p>

            <p>
                <label for="address">Permanent Address:</label><br>
                <textarea id="address" name="address" rows="3" cols="40" placeholder="Enter complete address"></textarea>
            </p>
        </fieldset>
        <br>

        <!-- Academic / Institutional Details -->
        <fieldset>
            <legend>Academic & Academic/Employment Details</legend>

            <p>
                <label for="id_number">ID Number (Roll No / Employee ID):</label><br>
                <input type="text" id="id_number" name="id_number" required placeholder="e.g., STU1234 or EMP5678">
            </p>

            <p>
                <label for="department">Department / Branch:</label><br>
                <select id="department" name="department" required>
                    <option value="">-- Select Department --</option>
                    <option value="cse">Computer Science & Engineering</option>
                    <option value="ece">Electronics & Communication</option>
                    <option value="ee">Electrical Engineering</option>
                    <option value="me">Mechanical Engineering</option>
                    <option value="ce">Civil Engineering</option>
                    <option value="admin">Administration</option>
                </select>
            </p>

            <p>
                <label for="designation">Designation / Role (For Faculty/Employees):</label><br>
                <input type="text" id="designation" name="designation" placeholder="e.g., Professor, Lab Assistant, Student">
            </p>

            <p>
                <label for="doj">Date of Joining / Admission:</label><br>
                <input type="date" id="doj" name="doj">
            </p>
        </fieldset>
        <br>

        <!-- Submission Buttons -->
        <p>
            <input type="submit" value="Submit Details">
            <input type="reset" value="Reset Form">
        </p>

    </form>

</body>
</html>
